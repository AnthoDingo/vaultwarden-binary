name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.event.inputs.version }}

  linux:
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ github.event.inputs.version }}

  release:
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux

    permissions:
      contents: write

    steps:
    - name: Download artefacts Windows
      uses: actions/download-artifact@v4
      with:
        name: vaultwarden-windows-${{ github.event.inputs.version }}
        path: artifacts/windows

    - name: Download artefacts Linux
      uses: actions/download-artifact@v4
      with:
        name: vaultwarden-linux-${{ github.event.inputs.version }}
        path: artifacts/linux

    - name: Create the release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: "Vaultwarden ${{ github.event.inputs.version }}"
        draft: false
        prerelease: false
        files: |
          artifacts/windows/*
          artifacts/linux/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}